function fromB64(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function unlock(pass){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(SALT),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(IV)},key,fromB64(DATA));
 return JSON.parse(new TextDecoder().decode(plain));
}
function show(docs){
 document.getElementById('gate').style.display='none';
 document.getElementById('vault').style.display='block';
 const c=document.getElementById('docs');
 docs.forEach(d=>{
  const url=URL.createObjectURL(new Blob([fromB64(d.b64)],{type:d.mime}));
  const row=document.createElement('div');row.className='doc';
  row.innerHTML='<span class="sq"></span><div><h3></h3><p></p></div>';
  row.querySelector('h3').textContent=d.name;
  row.querySelector('p').textContent=d.desc;
  const a=document.createElement('a');
  if(d.mime==='text/html'){a.textContent='Ouvrir';a.href=url;a.target='_blank';}
  else{a.textContent='Télécharger';a.href=url;a.download=d.name+'.pdf';}
  row.appendChild(a);c.appendChild(row);
 });
}
async function attempt(){
 const pw=document.getElementById('pw').value;
 try{const docs=await unlock(pw);sessionStorage.setItem('ixera-eq',pw);show(docs);}
 catch(e){document.getElementById('err').style.display='block';}
}
document.getElementById('go').addEventListener('click',attempt);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')attempt();});
const saved=sessionStorage.getItem('ixera-eq');
if(saved)unlock(saved).then(show).catch(()=>{});
</script></body></html>
