document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"91b7e8b6-c0c0-4e51-b9d1-be17c26959a8\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<title>Guide de prise de besoin — Ixera<\u002Ftitle>\n<meta name=\"robots\" content=\"noindex, nofollow\">\n<style>\nbody{margin:0;background:#f7f3ee;color:#11110f;font-family:Aptos,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\n*{box-sizing:border-box}\na{color:inherit;text-decoration:none}a:hover{color:#c81018}\ntextarea,input{font-family:inherit;color:#11110f}\ntextarea:focus,input:focus{outline:none;border-color:#ed1c24 !important}\n::placeholder{color:#b3aca1}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"display:grid;grid-template-columns:270px 1fr;min-height:100vh\">\n<aside style=\"position:sticky;top:0;height:100vh;overflow-y:auto;background:#f7f3ee;border-right:1px solid #e6ded4;padding:24px 20px 30px 24px\">\n<img src=\"2003b550-f7f4-4d3b-b573-2ea7674c6698\" alt=\"ixera — Bâtisseur d'équipes de direction du Québec\" style=\"width:100%;max-width:214px;height:auto;display:block\">\n<div style=\"margin-top:22px;padding:11px 13px;background:#fffaf5;border:1px solid #e6ded4\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n<span style=\"font-size:9px;font-weight:900;letter-spacing:0.13em;text-transform:uppercase;color:#5d5851\">Progression<\u002Fspan>\n<span style=\"font-size:11px;font-weight:900;color:#c81018\">{{ progressLabel }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin-top:8px;height:4px;background:#e6ded4\"><div style=\"height:4px;background:#ed1c24;width:{{ progressPct }}\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<nav style=\"margin-top:20px;display:grid;gap:16px\">\n<sc-for list=\"{{ phases }}\" as=\"nphase\" hint-placeholder-count=\"4\">\n<div>\n<div style=\"font-size:8.5px;font-weight:900;letter-spacing:0.14em;text-transform:uppercase;color:#c81018;padding-bottom:6px;border-bottom:1px solid #e6ded4\">{{ nphase.label }}<\u002Fdiv>\n<div style=\"display:grid;gap:2px;margin-top:6px\">\n<sc-for list=\"{{ nphase.sections }}\" as=\"nsec\" hint-placeholder-count=\"3\">\n<a href=\"#{{ nsec.id }}\" style=\"display:flex;align-items:baseline;gap:8px;padding:4px 6px;font-size:11px;font-weight:650;color:#4a453f;line-height:1.3\" style-hover=\"background:#fffaf5;color:#11110f\">\n<span style=\"font-weight:900;color:#11110f;min-width:16px\">{{ nsec.num }}<\u002Fspan>\n<span style=\"flex:1\">{{ nsec.title }}<\u002Fspan>\n<span style=\"font-size:9px;font-weight:800;color:#a09a90\">{{ nsec.count }}<\u002Fspan>\n<\u002Fa>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fnav>\n<\u002Faside>\n<main style=\"padding:34px 44px 90px 44px;max-width:900px\">\n<header style=\"border-bottom:2px solid #11110f;padding-bottom:16px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:10px;height:10px;background:#ed1c24\"><\u002Fspan><span style=\"font-size:10.5px;font-weight:900;letter-spacing:0.16em;text-transform:uppercase;color:#c81018\">Outil numérique de prise de besoin<\u002Fspan><\u002Fdiv>\n<h1 style=\"margin:10px 0 0 0;font-size:30px;font-weight:850;line-height:1.1;letter-spacing:-0.01em\">Guide de prise de besoin<\u002Fh1>\n<p style=\"margin:8px 0 0 0;font-size:12.5px;color:#5d5851;line-height:1.5;max-width:620px\">L'essentiel d'abord — en rencontre. Le terrain ensuite — à la visite. Le détail enfin — en visio. Tout ce que vous saisissez est enregistré automatiquement sur cet appareil.<\u002Fp>\n<\u002Fheader>\n<sc-for list=\"{{ phases }}\" as=\"phase\" hint-placeholder-count=\"2\">\n<div style=\"margin-top:36px\">\n<div style=\"display:flex;align-items:baseline;gap:12px;background:#11110f;padding:12px 18px\">\n<span style=\"font-size:11px;font-weight:900;letter-spacing:0.15em;text-transform:uppercase;color:#ffffff\">{{ phase.label }}<\u002Fspan>\n<span style=\"font-size:10.5px;color:#b3aca1\">{{ phase.sub }}<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{ phase.sections }}\" as=\"sec\" hint-placeholder-count=\"2\">\n<section id=\"{{ sec.id }}\" data-screen-label=\"{{ sec.title }}\" style=\"margin-top:14px;background:#fffaf5;border:1px solid #e6ded4;padding:22px 26px 26px 26px\">\n<div style=\"display:flex;align-items:baseline;gap:10px;border-bottom:1px solid #dcd4ca;padding-bottom:9px\">\n<span style=\"font-size:14px;font-weight:900;color:#c81018\">{{ sec.num }}<\u002Fspan>\n<span style=\"font-size:15px;font-weight:800\">{{ sec.title }}<\u002Fspan>\n<span style=\"margin-left:auto;font-size:9px;font-weight:800;letter-spacing:0.08em;color:#a09a90\">{{ sec.count }}<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:10px 0 0 0;font-size:11px;color:#5d5851;line-height:1.5\">{{ sec.intro }}<\u002Fp>\n<sc-if value=\"{{ sec.hasFields }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px 22px\">\n<sc-for list=\"{{ sec.fields }}\" as=\"f\" hint-placeholder-count=\"6\">\n<label style=\"display:flex;flex-direction:column;gap:5px\">\n<span style=\"font-size:9.5px;font-weight:800;letter-spacing:0.07em;text-transform:uppercase;color:#5d5851\">{{ f.label }}<\u002Fspan>\n<input type=\"text\" data-k=\"{{ f.id }}\" sc-camel-default-value=\"{{ f.val }}\" sc-camel-on-input=\"{{ save }}\" style=\"border:none;border-bottom:1px solid #dcd4ca;background:transparent;padding:4px 1px 6px 1px;font-size:13px;font-weight:600\">\n<\u002Flabel>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ sec.hasQs }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:8px;display:grid;gap:4px\">\n<sc-for list=\"{{ sec.qs }}\" as=\"q\" hint-placeholder-count=\"4\">\n<div style=\"padding:10px 0 6px 0;border-bottom:1px solid #f0eae2\">\n<div style=\"display:flex;gap:11px;align-items:flex-start;cursor:pointer\" data-k=\"{{ q.id }}\" sc-camel-on-click=\"{{ toggle }}\">\n<span style=\"{{ q.box }}\">{{ q.mark }}<\u002Fspan>\n<span style=\"font-size:12.5px;font-weight:700;line-height:1.45;color:#1c1a17\">{{ q.t }}<\u002Fspan>\n<\u002Fdiv>\n<textarea data-k=\"{{ q.id }}\" sc-camel-default-value=\"{{ q.val }}\" sc-camel-on-input=\"{{ save }}\" rows=\"2\" placeholder=\"Réponse…\" style=\"display:block;width:100%;margin:7px 0 0 26px;max-width:calc(100% - 26px);border:none;border-left:2px solid #e6ded4;background:transparent;padding:2px 0 4px 10px;font-size:12px;line-height:1.55;resize:none;overflow:hidden;color:#2c2925\"><\u002Ftextarea>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ sec.hasSwot }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n<sc-for list=\"{{ sec.swot }}\" as=\"sw\" hint-placeholder-count=\"4\">\n<div style=\"border:1px solid #e6ded4;background:#f7f3ee;padding:12px 14px\">\n<div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:7px;height:7px;background:{{ sw.c }}\"><\u002Fspan><span style=\"font-size:11px;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;color:{{ sw.c }}\">{{ sw.t }}<\u002Fspan><\u002Fdiv>\n<div style=\"margin-top:2px;font-size:9px;color:#8a837a\">{{ sw.hint }}<\u002Fdiv>\n<textarea data-k=\"{{ sw.id }}\" sc-camel-default-value=\"{{ sw.val }}\" sc-camel-on-input=\"{{ save }}\" rows=\"4\" placeholder=\"Des faits, pas des adjectifs…\" style=\"display:block;width:100%;margin-top:8px;border:none;border-top:1px solid #dcd4ca;background:transparent;padding:6px 0 0 0;font-size:12px;line-height:1.55;resize:none;overflow:hidden;color:#2c2925\"><\u002Ftextarea>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ sec.hasChecklist }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:18px\">\n<div style=\"font-size:9.5px;font-weight:900;letter-spacing:0.13em;text-transform:uppercase;color:#5d5851;border-bottom:1px solid #dcd4ca;padding-bottom:6px\">Documents à obtenir<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px 24px;margin-top:8px\">\n<sc-for list=\"{{ sec.checklist }}\" as=\"d\" hint-placeholder-count=\"6\">\n<div style=\"display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 0\" data-k=\"{{ d.id }}\" sc-camel-on-click=\"{{ toggle }}\">\n<span style=\"{{ d.box }}\">{{ d.mark }}<\u002Fspan>\n<span style=\"font-size:11.5px;line-height:1.4;color:#2c2925\">{{ d.label }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ sec.hasSynth }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:10px;display:grid;gap:14px\">\n<sc-for list=\"{{ sec.synth }}\" as=\"sy\" hint-placeholder-count=\"4\">\n<div>\n<div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:6px;height:6px;background:#ed1c24\"><\u002Fspan><span style=\"font-size:10.5px;font-weight:850;letter-spacing:0.06em;text-transform:uppercase\">{{ sy.label }}<\u002Fspan><\u002Fdiv>\n<textarea data-k=\"{{ sy.id }}\" sc-camel-default-value=\"{{ sy.val }}\" sc-camel-on-input=\"{{ save }}\" rows=\"2\" placeholder=\"…\" style=\"display:block;width:100%;margin-top:6px;border:none;border-left:2px solid #e6ded4;background:transparent;padding:2px 0 4px 10px;font-size:12px;line-height:1.55;resize:none;overflow:hidden;color:#2c2925\"><\u002Ftextarea>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<footer style=\"margin-top:40px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e6ded4;padding-top:14px;font-size:8.5px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#8a837a\">\n<span>Ixera — Bâtisseur d'équipes de direction du Québec<\u002Fspan>\n<span style=\"color:#c81018\">Confidentiel<\u002Fspan>\n<\u002Ffooter>\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { g: null, checks: {} };\n  KEY = 'ixera-guide-besoin';\n  answers = {};\n  componentDidMount() {\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem(this.KEY) || '{}'); } catch (e) {}\n    this.answers = Object.assign({}, Component.RESP, saved.a || {});\n    this.setState({ g: Component.DATA, checks: saved.c || {} }, () => this.resizeAll());\n  }\n  static DATA = {\"phases\":[{\"id\":\"ph0\",\"label\":\"Avant la rencontre\",\"sub\":\"Préparation\",\"sections\":[{\"id\":\"ficheA\",\"num\":\"A\",\"title\":\"Fiche client et mandat\",\"intro\":\"À préremplir avant la première rencontre (REQ, site Web, LinkedIn). Arriver préparé libère du temps pour l'essentiel.\",\"fields\":[{\"id\":\"a_nom\",\"label\":\"Nom de l'entreprise\"},{\"id\":\"a_web\",\"label\":\"Site Web\"},{\"id\":\"a_siege\",\"label\":\"Siège social / lieu de travail visé\"},{\"id\":\"a_fondation\",\"label\":\"Année de fondation\"},{\"id\":\"a_secteur\",\"label\":\"Secteur d'activité\"},{\"id\":\"a_groupe\",\"label\":\"Groupe / société mère\"},{\"id\":\"a_neq\",\"label\":\"NEQ / actionnariat réel (REQ)\"},{\"id\":\"a_admin\",\"label\":\"Administrateurs et entreprises liées (REQ)\"},{\"id\":\"a_interloc\",\"label\":\"Interlocuteur principal — nom, titre, coordonnées\"},{\"id\":\"a_decideur\",\"label\":\"Décideur final — nom et titre\"},{\"id\":\"a_superieur\",\"label\":\"Supérieur immédiat du poste\"},{\"id\":\"a_poste\",\"label\":\"Titre du poste à combler\"},{\"id\":\"a_consultant\",\"label\":\"Consultant Ixera\"},{\"id\":\"a_conf\",\"label\":\"Niveau de confidentialité\"},{\"id\":\"a_entree\",\"label\":\"Date cible d'entrée en fonction\"},{\"id\":\"a_dates\",\"label\":\"Dates : rencontre / visite / visios\"}]}]},{\"id\":\"ph1\",\"label\":\"Rencontre 1 — Face à face\",\"sub\":\"L'essentiel stratégique : pourquoi ils gagnent, où ils vont, ce qui est à risque.\",\"sections\":[{\"id\":\"ouverture\",\"num\":\"1\",\"title\":\"Ouverture\",\"intro\":\"Cadrer : un diagnostic d'organisation, pas une description de tâches.\",\"qs\":[{\"id\":\"q1_1\",\"t\":\"Dans vos mots : pourquoi ce poste, et pourquoi maintenant ?\"},{\"id\":\"q1_2\",\"t\":\"Si on réussit parfaitement ce mandat, qu'est-ce que ça change concrètement dans les 12 prochains mois ?\"},{\"id\":\"q1_3\",\"t\":\"Qu'est-ce qui vous inquiète le plus dans cette recherche ?\"},{\"id\":\"q1_4\",\"t\":\"Avez-vous déjà tenté de combler ce poste ? Par quels moyens, avec quels résultats ?\"}]},{\"id\":\"histoire\",\"num\":\"2\",\"title\":\"Histoire et trajectoire\",\"intro\":\"Ce qui explique comment l'entreprise fonctionne aujourd'hui.\",\"qs\":[{\"id\":\"q2_1\",\"t\":\"Fondateurs et année de fondation — sont-ils encore actifs, et avec quelle influence réelle ?\"},{\"id\":\"q2_2\",\"t\":\"Grandes étapes (croissance, acquisitions, crises, changements de propriété) : qu'est-ce qui explique le mieux le fonctionnement actuel ?\"},{\"id\":\"q2_3\",\"t\":\"À quelle phase êtes-vous : création, croissance, maturité, transition, succession, redressement ? Sur quels faits concrets ?\"},{\"id\":\"q2_4\",\"t\":\"Une transaction ou une relève est-elle envisagée à moyen terme ? (vente, acquisition, transfert familial, rachat)\"}]},{\"id\":\"differenciateurs\",\"num\":\"3\",\"title\":\"Différenciateurs — pourquoi ils gagnent\",\"intro\":\"Chercher l'incopiable : ce que le marché ne peut pas répliquer.\",\"qs\":[{\"id\":\"q3_1\",\"t\":\"Qu'est-ce qui vous distingue réellement de la concurrence, du point de vue de vos clients ?\"},{\"id\":\"q3_2\",\"t\":\"Qu'est-ce qui est incopiable chez vous ? (savoir-faire, relations, culture, actifs, réputation, données)\"},{\"id\":\"q3_3\",\"t\":\"Comment faites-vous ce que vous faites ? Qu'est-ce que vos concurrents ne comprennent pas de votre modèle ?\"},{\"id\":\"q3_4\",\"t\":\"Quels produits ou services génèrent le plus de revenus ? Lesquels ont la meilleure marge ?\"},{\"id\":\"q3_5\",\"t\":\"Où êtes-vous vulnérables face à la concurrence ?\"}]},{\"id\":\"plan\",\"num\":\"4\",\"title\":\"Plan stratégique\",\"intro\":\"Le lien entre l'ambition et la capacité réelle d'exécution.\",\"qs\":[{\"id\":\"q5_1\",\"t\":\"Objectifs pour les 12 prochains mois ? Pour les 3 à 5 prochaines années ? (chiffre d'affaires, rentabilité)\"},{\"id\":\"q5_2\",\"t\":\"Cette croissance viendra d'où : organique, acquisitions, nouveaux marchés, nouveaux produits ?\"},{\"id\":\"q5_3\",\"t\":\"Qu'est-ce qui vous empêche aujourd'hui d'atteindre ces objectifs ?\"},{\"id\":\"q5_4\",\"t\":\"Les trois priorités où vous ne pouvez pas vous permettre d'échouer ?\"}]},{\"id\":\"risques\",\"num\":\"5\",\"title\":\"Risques et continuité\",\"intro\":\"Le bloc distinctif Ixera : dépendances aux personnes clés. À aborder avec tact.\",\"qs\":[{\"id\":\"q7_1\",\"t\":\"Sur qui l'organisation dépend-elle trop ? Si cette personne quittait demain, que se passe-t-il dans les 30 jours ?\"},{\"id\":\"q7_2\",\"t\":\"Une relève est-elle identifiée pour les postes clés ? Prête, ou à développer ?\"},{\"id\":\"q7_3\",\"t\":\"Quels départs sont prévisibles d'ici cinq ans ? (retraite, désengagement, sollicitation du marché)\"},{\"id\":\"q7_4\",\"t\":\"Le poste à combler répond-il à un de ces risques ?\"}]}]},{\"id\":\"ph2\",\"label\":\"Rencontre 2 — La visite des lieux\",\"sub\":\"Le terrain : les gens, la culture, ce que les yeux confirment ou contredisent.\",\"sections\":[{\"id\":\"gens\",\"num\":\"6\",\"title\":\"Les gens\",\"intro\":\"L'équipe réelle derrière l'organigramme.\",\"qs\":[{\"id\":\"q6_1\",\"t\":\"Équipe de direction : qui, depuis quand, et quelle dynamique réelle ? (cohésion, tensions, silos)\"},{\"id\":\"q6_2\",\"t\":\"Qui sont les personnes les plus influentes, au-delà des titres ?\"},{\"id\":\"q6_3\",\"t\":\"Quel comportement est immédiatement valorisé ? Lequel ne passe pas ? Quel type de personnalité ne survivrait pas ?\"},{\"id\":\"q6_4\",\"t\":\"Pourquoi les gens restent-ils ? Pourquoi partent-ils ?\"},{\"id\":\"q6_5\",\"t\":\"Votre équipe actuelle peut-elle livrer le plan ? Où sont les écarts ?\"}]},{\"id\":\"terrain\",\"num\":\"7\",\"title\":\"Observations terrain\",\"intro\":\"À noter pendant et juste après la visite — ce qu'on voit, pas ce qu'on nous dit.\",\"qs\":[{\"id\":\"qt_1\",\"t\":\"État des installations : ordre, entretien, sécurité, investissements visibles ou vieillissement ?\"},{\"id\":\"qt_2\",\"t\":\"Ambiance et interactions observées : direction–plancher, rythme, langage, affichage interne ?\"},{\"id\":\"qt_3\",\"t\":\"Écarts entre le discours de la première rencontre et la réalité observée ?\"},{\"id\":\"qt_4\",\"t\":\"Systèmes et façons de faire vus sur place : outils, processus documentés ou dépendants des personnes ?\"}]},{\"id\":\"swot\",\"num\":\"8\",\"title\":\"SWOT\",\"intro\":\"À compléter après la première rencontre et la visite. Interne : forces et faiblesses. Externe : opportunités et menaces. Des faits, pas des adjectifs.\",\"swot\":[{\"id\":\"swot_f\",\"t\":\"Forces\",\"hint\":\"Interne — ce qui les rend bons, prouvé par des faits\",\"c\":\"#c81018\"},{\"id\":\"swot_w\",\"t\":\"Faiblesses\",\"hint\":\"Interne — écarts, dépendances, ce qui manque\",\"c\":\"#5d5851\"},{\"id\":\"swot_o\",\"t\":\"Opportunités\",\"hint\":\"Externe — marchés, tendances, consolidation\",\"c\":\"#c81018\"},{\"id\":\"swot_m\",\"t\":\"Menaces\",\"hint\":\"Externe — concurrents, réglementation, cycle\",\"c\":\"#5d5851\"}]}]},{\"id\":\"ph3\",\"label\":\"Rencontres 3 — Visios de complément\",\"sub\":\"Décortiquer : le poste, le profil, les conditions et les règles du mandat.\",\"sections\":[{\"id\":\"poste\",\"num\":\"9\",\"title\":\"Le poste\",\"intro\":\"Sa raison d'être, ses chantiers, sa réalité.\",\"qs\":[{\"id\":\"q8_1\",\"t\":\"En une phrase : la raison d'être du poste ? Quel problème d'affaires doit-il résoudre ?\"},{\"id\":\"q8_2\",\"t\":\"Création ou remplacement ? Qu'est-il arrivé au prédécesseur — et que ferez-vous différemment cette fois-ci ?\"},{\"id\":\"q8_3\",\"t\":\"Les deux ou trois choses que la personne doit absolument réussir dans les 12 premiers mois ?\"},{\"id\":\"q8_4\",\"t\":\"Qu'est-ce qui, réalistement, pourrait la faire échouer chez vous ?\"},{\"id\":\"q8_5\",\"t\":\"Rattachement, équipe à gérer, autonomie décisionnelle réelle et budget sous gestion ?\"},{\"id\":\"q8_6\",\"t\":\"Conditions : lieu, jours de présence, horaire, déplacements ?\"}]},{\"id\":\"profil\",\"num\":\"10\",\"title\":\"Profil et rémunération\",\"intro\":\"Distinguer l'éliminatoire du souhaitable — pas plus de cinq critères essentiels.\",\"qs\":[{\"id\":\"q9_1\",\"t\":\"Critères essentiels (éliminatoires) vs souhaitables ? Comment les valider ?\"},{\"id\":\"q9_2\",\"t\":\"Expériences spécifiques recherchées ? (croissance, redressement, structuration, intégration post-acquisition)\"},{\"id\":\"q9_3\",\"t\":\"Dans quelles entreprises trouve-t-on ce profil ? Des personnes précises en tête ? Des zones interdites ?\"},{\"id\":\"q9_4\",\"t\":\"Fourchette salariale, bonification, avantages — et la flexibilité réelle pour un candidat exceptionnel ?\"},{\"id\":\"q9_5\",\"t\":\"Pourquoi un excellent candidat, bien installé ailleurs, dirait oui ? Quelles objections anticipez-vous ?\"}]},{\"id\":\"mandat\",\"num\":\"11\",\"title\":\"Mandat et prochaines étapes\",\"intro\":\"Les règles du jeu qui déterminent la vitesse d'exécution.\",\"qs\":[{\"id\":\"q10_1\",\"t\":\"Confidentialité : qui sait, qui ne doit pas savoir, quand divulguer le nom de l'entreprise ?\"},{\"id\":\"q10_2\",\"t\":\"Processus de sélection : étapes, décideurs, droit de veto, délai de réaction visé ?\"},{\"id\":\"q10_3\",\"t\":\"Dates cibles : premières candidatures, entrée en fonction ?\"},{\"id\":\"q10_4\",\"t\":\"Y a-t-il quelque chose que vous hésitez à me dire mais qui aurait un impact sur ma recherche ?\"}],\"checklist\":[{\"id\":\"d_organigramme\",\"label\":\"Organigramme de l'organisation et du secteur visé\"},{\"id\":\"d_description\",\"label\":\"Description de poste actuelle (si elle existe)\"},{\"id\":\"d_plan\",\"label\":\"Plan stratégique ou document d'orientation\"},{\"id\":\"d_finances\",\"label\":\"États financiers ou rapport annuel\"},{\"id\":\"d_salaire\",\"label\":\"Structure salariale et sommaire des avantages\"},{\"id\":\"d_teletravail\",\"label\":\"Politique de télétravail\"},{\"id\":\"d_grille\",\"label\":\"Grille d'évaluation des candidats\"},{\"id\":\"d_contrat\",\"label\":\"Contrat de mandat signé\"}]}]},{\"id\":\"ph4\",\"label\":\"Après les rencontres\",\"sub\":\"Le résumé exécutif qui guide la recherche.\",\"sections\":[{\"id\":\"synthese\",\"num\":\"S\",\"title\":\"Synthèse du mandat\",\"intro\":\"À remplir pendant que tout est frais. Valider par écrit avec le client dans les 48 heures.\",\"synth\":[{\"id\":\"s_client\",\"label\":\"Le client en une phrase\"},{\"id\":\"s_cap\",\"label\":\"Où l'entreprise veut aller (12 à 36 mois)\"},{\"id\":\"s_diff\",\"label\":\"Le différenciateur incopiable\"},{\"id\":\"s_reussir\",\"label\":\"Ce que la personne devra absolument réussir\"},{\"id\":\"s_risques\",\"label\":\"Risques de continuité managériale observés\"},{\"id\":\"s_etapes\",\"label\":\"Prochaines étapes datées\"}]}]}]};\n  static RESP = {};\n  resizeAll() {\n    document.querySelectorAll('textarea[data-k]').forEach(t => {\n      t.style.height = 'auto'; t.style.height = Math.max(t.scrollHeight, 30) + 'px';\n    });\n  }\n  persist() {\n    try { localStorage.setItem(this.KEY, JSON.stringify({ a: this.answers, c: this.state.checks })); } catch (e) {}\n  }\n  save = (e) => {\n    const t = e.target;\n    this.answers[t.dataset.k] = t.value;\n    if (t.tagName === 'TEXTAREA') { t.style.height = 'auto'; t.style.height = Math.max(t.scrollHeight, 30) + 'px'; }\n    this.persist();\n  };\n  toggle = (e) => {\n    const k = e.currentTarget.dataset.k;\n    this.setState(s => ({ checks: Object.assign({}, s.checks, { [k]: !s.checks[k] }) }), () => this.persist());\n  };\n  box(done) {\n    return done\n      ? { width: '15px', height: '15px', background: '#ed1c24', border: '1.5px solid #ed1c24', flexShrink: 0, marginTop: '1.5px', color: '#fff', fontSize: '10px', fontWeight: 900, display: 'flex', alignItems: 'center', justifyContent: 'center', lineHeight: 1 }\n      : { width: '15px', height: '15px', background: 'transparent', border: '1.5px solid #b9b1a6', flexShrink: 0, marginTop: '1.5px', color: 'transparent', fontSize: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center', lineHeight: 1 };\n  }\n  renderVals() {\n    const g = this.state.g, ck = this.state.checks, A = this.answers;\n    if (!g) return { phases: [], progressLabel: '', progressPct: '0%', save: this.save, toggle: this.toggle };\n    let done = 0, total = 0;\n    const phases = g.phases.map(p => ({\n      id: p.id, label: p.label, sub: p.sub,\n      sections: p.sections.map(s => {\n        const qs = (s.qs || []).map(q => ({ id: q.id, t: q.t, val: A[q.id] || '', box: this.box(!!ck[q.id]), mark: ck[q.id] ? '✓' : '' }));\n        const checklist = (s.checklist || []).map(d => ({ id: d.id, label: d.label, box: this.box(!!ck[d.id]), mark: ck[d.id] ? '✓' : '' }));\n        const nDone = qs.filter(q => ck[q.id]).length + checklist.filter(d => ck[d.id]).length;\n        const nTot = qs.length + checklist.length;\n        done += nDone; total += nTot;\n        return {\n          id: s.id, num: s.num, title: s.title, intro: s.intro,\n          count: nTot ? nDone + '/' + nTot : '',\n          fields: (s.fields || []).map(f => ({ id: f.id, label: f.label, val: A[f.id] || '' })),\n          hasFields: !!(s.fields && s.fields.length),\n          qs, hasQs: qs.length > 0,\n          swot: (s.swot || []).map(w => ({ id: w.id, t: w.t, hint: w.hint, c: w.c, val: A[w.id] || '' })),\n          hasSwot: !!(s.swot && s.swot.length),\n          checklist, hasChecklist: checklist.length > 0,\n          synth: (s.synth || []).map(y => ({ id: y.id, label: y.label, val: A[y.id] || '' })),\n          hasSynth: !!(s.synth && s.synth.length)\n        };\n      })\n    }));\n    const pct = total ? Math.round(100 * done / total) : 0;\n    return { phases, progressLabel: pct + ' %', progressPct: pct + '%', save: this.save, toggle: this.toggle };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
